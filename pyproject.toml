[project]
name = "transit-delay-analytics"
version = "0.1.0"
description = "Configuration-driven data pipeline and stochastic modelling framework for analyzing public transport delays using GTFS and near real-time vehicle GPS data."
readme = "README.md"
authors = [{ name = "Jüri Vinnal", email = "juvinn@taltech.ee" }]
requires-python = ">=3.12"
dependencies = ["requests>=2.31.0"] # "httpx>=0.24.0"

[project.scripts]
transit-delay-analytics = "transit_delay_analytics.__main__:main"
tra = "transit_delay_analytics.__main__:main"

[build-system]
requires = ["uv_build>=0.11.14,<0.12.0"]
build-backend = "uv_build"
