[project]
name = "transit-delay-analytics"
version = "0.1.0"
description = "Configuration-driven data pipeline and stochastic modelling framework for analyzing public transport delays using GTFS and near real-time vehicle GPS data."
readme = "README.md"
authors = [{ name = "Jüri Vinnal", email = "juvinn@taltech.ee" }]
requires-python = ">=3.12"
license = "MIT"

dependencies = [
    "duckdb>=1.5.2",
    "ipykernel>=7.2.0",
    "nbconvert>=7.17.1",
    "numpy>=2.4.6",
    "polars[numpy,pandas]>=1.40.1",
    "requests>=2.34.2",
] # "httpx>=0.24.0"

[project.scripts]
transit-delay-analytics = "transit_delay_analytics.__main__:main"
tra = "transit_delay_analytics.__main__:main"

[build-system]
requires = ["uv_build>=0.11.14,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "contextily>=1.7.0",
    "duckdb>=1.5.2",
    "folium>=0.20.0",
    "matplotlib>=3.11.0",
    "plotly>=6.8.0",
    "pyarrow>=24.0.0",
    "pylint>=4.0.5",
    "pytz>=2026.2",
    "ruff>=0.15.13",
    "sqlfluff>=4.2.1",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
