# .github/workflows/ci.yml
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.6.15"

      - name: Install Python 3.12
        run: uv python install 3.12

      - name: Sync dependencies
        run: uv sync --python 3.12 --locked

      - name: Run tests
        run: uv run --python 3.12 pytest tests/ -v

      - name: Run lint
        run: uv run --python 3.12 ruff check src/ tests/

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t transit-delay-analytics:${{ github.sha }} .

      - name: Verify image runs
        run: docker run --rm transit-delay-analytics:${{ github.sha }} tra --help