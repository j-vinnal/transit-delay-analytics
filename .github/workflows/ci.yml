# .github/workflows/ci.yml
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.6.15"

      - name: Platform info
        run: |
          uname -a
          ldd --version
          uv --version

      - name: Sync dependencies (no lock)
        run: uv sync --no-dev

      - name: Test core imports
        run: |
          uv run python -c "import sys; print(sys.version)"
          uv run python -c "import polars; print('polars OK')"
          uv run python -c "import duckdb; print('duckdb OK')"
          uv run python -c "import numpy; print('numpy OK')"

      - name: Sync with dev dependencies
        run: uv sync

      - name: Run tests with faulthandler
        env:
          PYTHONFAULTHANDLER: 1
        run: uv run python -X faulthandler -m pytest tests/ -v --tb=long -x

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t transit-delay-analytics:${{ github.sha }} .

      - name: Verify image runs
        run: docker run --rm transit-delay-analytics:${{ github.sha }} tra --help